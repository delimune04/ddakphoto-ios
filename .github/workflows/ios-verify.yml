name: iOS verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, XCTest, and native screenshots
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check release metadata and portable regression tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/verify-metadata.py

      - name: Select newest installed Xcode 26 or newer
        run: python3 scripts/select-xcode.py

      - name: Verify app and capture simulator screenshots
        run: ./scripts/verify-ios.sh

      - name: Upload verification results and native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddakphoto-ios-verification
          path: |
            build/verification/
            release/screenshots/
          if-no-files-found: warn
          retention-days: 14
